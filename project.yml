name: HoopTrack

attributes:
  LastUpgradeCheck: "2660"

options:
  bundleIdPrefix: com.arturhi
  deploymentTarget:
    iOS: "26.3.1"
    watchOS: "11.6.2"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4W536RHVDM
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HoopTrack:
    type: application
    platform: iOS
    deploymentTarget: "26.3.1"
    sources:
      - path: HoopTrack
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturhi.HoopTrack
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "HoopTrack uses the camera to record video of your shooting sessions so you can review each shot."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "HoopTrack may record audio along with video of your shooting sessions."
    dependencies:
      - target: HoopTrack Watch App
        embed: true
    scheme:
      testTargets:
        - HoopTrackTests

  HoopTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.3.1"
    sources:
      - path: HoopTrackTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturhi.HoopTrackTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HoopTrack

  HoopTrack Watch App:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.6.2"
    sources:
      - path: HoopTrack Watch App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturhi.HoopTrack.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # A static Info.plist (not GENERATE_INFOPLIST_FILE) because Xcode's
        # synthesizer unconditionally force-adds the legacy WKWatchKitApp key
        # for this product type, which conflicts with WKApplication and makes
        # watchOS 26 refuse to install the app as a "WatchKit 1.0" app.
        INFOPLIST_FILE: "HoopTrack Watch App/Info.plist"
        # Clears the legacy WatchKit-2 stub binary source XcodeGen's watchapp2
        # product type still defaults to; without this it collides with our
        # own compiled binary ("Multiple commands produce ... Watch App").
        PRODUCT_BINARY_SOURCE_PATH: ""
